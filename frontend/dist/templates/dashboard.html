<div class="main__content">
    <div class="container main__content-container">
        <h1 class="main__content-title">Главная</h1>
        <div class="main__content-tabs">
            <div class="tab tab-today btn btn-secondary">Сегодня</div>
            <div class="tab tab-week btn btn-outline-secondary">Неделя</div>
            <div class="tab tab-month btn btn-outline-secondary">Месяц</div>
            <div class="tab tab-year btn btn-outline-secondary">Год</div>
            <div class="tab tab-all btn btn-outline-secondary">Все</div>
            <div class="tab tab-interval ">
                <div class="tab interval btn btn-outline-secondary">Интервал</div>
                с
                <div class="interval-date text-secondary">Дата</div>
                с
                <div class="interval-date text-secondary">Дата</div>
            </div>
        </div>
        <div class="main__content-charts">
            <div class="chart__income">
                <h3 class="chart__income-title chart-title">
                    Доходы
                </h3>
                <div class="chart__income-chart chart" id="income-chart">
                    <div class="chart__tabs">
                        <div class="chart-tab chart__tabs-red">
                            <div class="tab-block"></div>
                            <p class="tab-text">Red</p>
                        </div>
                        <div class="chart-tab chart__tabs-orange">
                            <div class="tab-block"></div>
                            <p class="tab-text">Orange</p>
                        </div>
                        <div class="chart-tab chart__tabs-yellow">
                            <div class="tab-block"></div>
                            <p class="tab-text">Yellow</p>
                        </div>
                        <div class="chart-tab chart__tabs-green">
                            <div class="tab-block"></div>
                            <p class="tab-text">Green</p>
                        </div>
                        <div class="chart-tab chart__tabs-blue">
                            <div class="tab-block"></div>
                            <p class="tab-text">Blue</p>
                        </div>
                    </div>
                    <div class="chart__pie">
                        <img src="static/images/pie-income.png" alt="Доходы">
                    </div>
                </div>
            </div>
            <div class="chart__line"></div>
            <div class="chart__expenses">
                <h3 class="chart__expenses-title chart-title">
                    Расходы
                </h3>
                <div class="chart__expenses-chart chart" id="expenses-chart">
                    <div class="chart__tabs">
                        <div class="chart-tab chart__tabs-red">
                            <div class="tab-block"></div>
                            <p class="tab-text">Red</p>
                        </div>
                        <div class="chart-tab chart__tabs-orange">
                            <div class="tab-block"></div>
                            <p class="tab-text">Orange</p>
                        </div>
                        <div class="chart-tab chart__tabs-yellow">
                            <div class="tab-block"></div>
                            <p class="tab-text">Yellow</p>
                        </div>
                        <div class="chart-tab chart__tabs-green">
                            <div class="tab-block"></div>
                            <p class="tab-text">Green</p>
                        </div>
                        <div class="chart-tab chart__tabs-blue">
                            <div class="tab-block"></div>
                            <p class="tab-text">Blue</p>
                        </div>
                    </div>
                    <div class="chart__pie">
                        <img src="static/images/pie-expenses.png" alt="Расходы">
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
