<div class="main__content">
    <div class="container main__content-container">
        <h1 class="main__content-title">Главная</h1>

        <div class="main__content-tabs">
            <div class="tab btn btn-secondary" data-filter="today">Сегодня</div>
            <div class="tab btn btn-outline-secondary" data-filter="week">Неделя</div>
            <div class="tab btn btn-outline-secondary" data-filter="month">Месяц</div>
            <div class="tab btn btn-outline-secondary" data-filter="year">Год</div>
            <div class="tab btn btn-outline-secondary" data-filter="all">Все</div>

            <div class="tab tab-interval">
                <div class="tab btn btn-outline-secondary" data-filter="interval">Интервал</div>
                <span class="text-secondary ms-2">c</span>
                <input type="date" class="form-control form-control-sm interval-from ms-2" />
                <span class="text-secondary ms-2">по</span>
                <input type="date" class="form-control form-control-sm interval-to ms-2" />
            </div>
        </div>

        <div class="main__content-charts">
            <div class="chart__income">
                <h3 class="chart__income-title chart-title">Доходы</h3>
                <div class="chart__income-chart chart" id="income-chart">
                    <!-- ИСПРАВЛЕНО: canvas -->
                    <canvas id="incomePie" aria-label="График доходов" role="img"></canvas>
                </div>
            </div>

            <div class="chart__line"></div>

            <div class="chart__expenses">
                <h3 class="chart__expenses-title chart-title">Расходы</h3>
                <div class="chart__expenses-chart chart" id="expenses-chart">
                    <!-- ИСПРАВЛЕНО: canvas -->
                    <canvas id="expensePie" aria-label="График расходов" role="img"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>
