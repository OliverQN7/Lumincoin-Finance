<!-- templates/operations.html -->
<div class="main__content">
    <div class="container main__content-container">
        <h1 class="main__content-title">Доходы и расходы</h1>

        <div class="main__content-actions mb-5">
            <!-- две кнопки, просто переход на форму создания с предустановленным типом через query -->
            <button class="tab__actions-create btn btn-success"
                    onclick="location.href='/operations-create?type=income'">
                Создать доход
            </button>
            <button class="tab__actions-delete btn btn-danger"
                    onclick="location.href='/operations-create?type=expense'">
                Создать расход
            </button>
        </div>

        <!-- Фильтры по датам -->
        <div class="main__content-tabs mb-3">
            <div class="tab btn btn-secondary" data-filter="today">Сегодня</div>
            <div class="tab btn btn-outline-secondary" data-filter="week">Неделя</div>
            <div class="tab btn btn-outline-secondary" data-filter="month">Месяц</div>
            <div class="tab btn btn-outline-secondary" data-filter="year">Год</div>
            <div class="tab btn btn-outline-secondary" data-filter="all">Все</div>

            <div class="tab tab-interval d-flex align-items-center gap-3">
                <button class="btn btn-outline-secondary" data-filter="interval">Интервал</button>
                <span>с</span>
                <input type="date" class="form-control form-control-sm interval-from"/>
                <span>по</span>
                <input type="date" class="form-control form-control-sm interval-to"/>
            </div>
        </div>

        <!-- Таблица операций -->
        <div class="main__content-table">
            <table class="table table-striped align-middle">
                <thead>
                <tr>
                    <th scope="col">№ операции</th>
                    <th scope="col">Тип</th>
                    <th scope="col">Категория</th>
                    <th scope="col">Сумма</th>
                    <th scope="col">Дата</th>
                    <th scope="col">Комментарий</th>
                    <th scope="col" class="text-end">Действия</th>
                </tr>
                </thead>
                <tbody id="operations-body">
                <!-- сюда JS будет рендерить строки -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Модалка удаления -->
<div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel"
     aria-hidden="true" role="dialog">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-body pt-4 px-4 pb-0 mb-4">
                <p class="mb-0 text-center">Вы действительно хотите удалить операцию?</p>
            </div>
            <div class="modal-footer justify-content-center gap-2 border-0 pt-0 px-4 pb-4">
                <button type="button" class="btn btn-success btn-confirm-delete">
                    Да, удалить
                </button>
                <button type="button" class="btn btn-danger" data-bs-dismiss="modal">
                    Не удалять
                </button>
            </div>
        </div>
    </div>
</div>
