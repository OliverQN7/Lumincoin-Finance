<section class="main d-flex py-4 justify-content-center align-items-center">
    <div class="container d-flex justify-content-center align-items-center row">
        <div class="main__logo d-flex justify-content-center mb-5">
            <img src="static/images/logo.png" alt="Логотип">
        </div>
        <h1 class="main__title mb-3">Создайте аккаунт</h1>
        <div class="error invalid-feedback text-center mb-3" id="common-error">Не удалось зарегистрировать
            пользователя. Обратитесь в поддержку!
        </div>
        <form class="main__form form-group mx-auto d-flex flex-column needs-validation" novalidate>
            <div class="main__form-input input-group mb-4">
                <div class="input__icon input-group-text">
                    <img src="static/images/icons/fio.svg" alt="ФИО">
                </div>
                <div class="input__block form-floating ">
                    <input type="text" class="input__block-input form-control" id="input-firstName" placeholder="Имя"
                           required>
                    <label for="input-firstName" class="input__block-label">Имя</label>
                    <div class="invalid-feedback">
                        Введите Имя.
                    </div>
                </div>
            </div>
            <div class="main__form-input input-group mb-4">
                <div class="input__icon input-group-text">
                    <img src="static/images/icons/fio.svg" alt="ФИО">
                </div>
                <div class="input__block form-floating ">
                    <input type="text" class="input__block-input form-control" id="input-lastName" placeholder="Фамилия"
                           required>
                    <label for="input-lastName" class="input__block-label">Фамилия</label>
                    <div class="invalid-feedback">
                        Введите Фамилию.
                    </div>
                </div>
            </div>
            <div class="main__form-input input-group mb-4">
                <div class="input__icon input-group-text">
                    <img src="static/images/icons/email.svg" alt="Электронная почта">
                </div>
                <div class="input__block form-floating">
                    <input type="email" class="input__block-input form-control" id="input-email"
                           placeholder="Электронная почта" required>
                    <label for="input-email" class="input__block-label">Электронная почта</label>
                    <div class="invalid-feedback">
                        Введите электронную почту.
                    </div>
                </div>
            </div>
            <div class="main__form-input input-group mb-4">
                <div class="input__icon input-group-text">
                    <img src="static/images/icons/password.svg" alt="Пароль">
                </div>
                <div class="input__block form-floating">
                    <input type="password" class="input__block-input form-control" id="input-password"
                           placeholder="Пароль" required>
                    <label for="input-password" class="input__block-label">Пароль</label>
                    <div class="invalid-feedback">
                        Введите пароль.
                    </div>
                </div>
            </div>
            <div class="main__form-input input-group mb-4">
                <div class="input__icon input-group-text">
                    <img src="static/images/icons/password.svg" alt="Подтверждение пароля">
                </div>
                <div class="input__block form-floating">
                    <input type="password" class="input__block-input form-control" id="input-passwordRepeat"
                           placeholder="Подтверждение пароля" required>
                    <label for="input-passwordRepeat" class="input__block-label">Подтверждение пароля</label>
                    <div class="invalid-feedback">
                        Пароли не совпадают.
                    </div>
                </div>
            </div>
            <button type="button" class="btn bg-primary text-white mb-3" id="process-button">Войти</button>
            <div class="main__link">Уже есть аккаунт? <a href="/login">Войдите в систему</a></div>
        </form>
    </div>
</section>
